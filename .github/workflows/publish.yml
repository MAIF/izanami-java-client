name: Publish to maven central

on:
  push:
      tags:
        - v2.**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish to Apache Maven Central
        run: mvn -B clean deploy -PsonatypeDeploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: List staged content
        if: always()
        run: |
          find target/central-staging -type f | sort
          unzip -l target/central-publishing/central-bundle.zip || true
      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: |
            target/central-publishing/
            target/central-staging/